name: "Github Config Sync"
description: "Home Assistant app for GitHub config sync operations, not backups. Private repositories are strongly recommended; public visibility is optional."
version: "1.7.1"
slug: "github_config_sync_web"
url: "https://github.com/TheBlackMini/GithubConfigSync"
init: false
startup: services
boot: auto
ingress: true
ingress_port: 8099
hassio_api: true
panel_icon: mdi:github
panel_title: Github Config Sync
arch:
  - aarch64
  - amd64
map:
  - config:rw
  - addon_configs:rw
  - media:rw
  - share:rw
  - ssl
  - backups:rw
  - www:rw
ports:
  8099/tcp: null
ports_description:
  8099/tcp: "Web UI (optional when using ingress)"
options:
  github_repository: ""
  github_branch: "main"
  github_token: ""
  github_client_id: ""
  scheduler_timezone: ""
  sync_include_patterns: ""
  sync_exclude_patterns: ""
  clean_preserve_paths: ""
  version_retention_count: 7
  dry_run: true
  include_addon_configs: false
  include_media: false
  include_share: false
  include_ssl: false
  include_backups: false
  include_www: false
  sync_mode: "whitelist"
  precommit_mode: "enabled"
  log_level: "INFO"
schema:
  github_repository: str?
  github_branch: str
  github_token: password?
  github_client_id: str?
  scheduler_timezone: str?
  sync_include_patterns: str?
  sync_exclude_patterns: str?
  clean_preserve_paths: str?
  version_retention_count: int(1,100)?
  dry_run: bool?
  include_addon_configs: bool?
  include_media: bool?
  include_share: bool?
  include_ssl: bool?
  include_backups: bool?
  include_www: bool?
  sync_mode: list(whitelist|blacklist)?
  precommit_mode: list(enabled|warn|disabled)?
  log_level: list(DEBUG|INFO|WARN|ERROR)?
