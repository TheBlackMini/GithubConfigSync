# Keep dependency updates grouped and easy to review.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10

  - package-ecosystem: "docker"
    directory: "/addons/github-config-sync"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10