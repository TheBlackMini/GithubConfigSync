name: Bug report
description: Report a problem with the add-on or the sync engine
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Add-on version
      description: Which add-on version are you running?
      placeholder: e.g. 1.6.0
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Sync mode
      description: Which sync mode was active?
      options:
        - Whitelist (default)
        - Blacklist
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Include any error text from the add-on log.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
  - type: textarea
    id: diag
    attributes:
      label: Diagnostics bundle
      description: Paste the Diagnostics bundle (from the add-on UI, Diagnostics section) with the token value redacted.
      render: json