name: Ask a question / get help
description: Ask for help installing, configuring, or using the add-on
body:
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Installation
        - Configuration / options
        - Whitelist / Blacklist patterns
        - Device Flow / authentication
        - Scheduled sync
        - Other
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Be specific — include what you already tried.
    validations:
      required: true